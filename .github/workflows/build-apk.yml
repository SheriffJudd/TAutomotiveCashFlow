name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v3 app
        run: |
          unzip "TAutomotiveCashFlow-v3.zip" -d source

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > release.jks

          test -s release.jks

      - name: Build release APK
        run: |
          cd source/TAutomotiveCashFlow
          gradle :app:assembleRelease --stacktrace

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="/usr/local/lib/android/sdk/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -v -p 4 \
            source/TAutomotiveCashFlow/app/build/outputs/apk/release/app-release-unsigned.apk \
            source/TAutomotiveCashFlow/TAutomotiveCashFlow-v3-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias tautomotive \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out source/TAutomotiveCashFlow/TAutomotiveCashFlow-v3.apk \
            source/TAutomotiveCashFlow/TAutomotiveCashFlow-v3-aligned.apk

      - name: Verify APK signature
        run: |
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify \
            --verbose \
            --print-certs \
            source/TAutomotiveCashFlow/TAutomotiveCashFlow-v3.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TAutomotiveCashFlow-v3-SIGNED
          path: source/TAutomotiveCashFlow/TAutomotiveCashFlow-v3.apk
